<style>
:root{--ink-900:#0a0a0b;--ink-800:#18181b;--ink-700:#27272a;--ink-600:#52525b;--ink-500:#71717a;--ink-400:#a1a1aa;--ink-300:#d4d4d8;--ink-200:#e4e4e7;--ink-100:#f4f4f5;--ink-50:#fafafa;--brand-50:#eff4ff;--brand-300:#93b4fd;--brand-500:#3b6ff7;--brand-600:#2a56eb;--brand-700:#2244d8;--blue:#2d5eef;--green:#0e9f6e;--green-bg:#e8f7f0;--red:#b42318;--red-bg:#fee4e2;--amber-bg:#fef3c7;--amber:#92400e;--shadow-card:0 1px 2px rgba(16,24,40,.04),0 10px 30px -14px rgba(16,24,40,.10);--shadow-soft:0 1px 2px rgba(16,24,40,.03),0 16px 44px -18px rgba(30,52,120,.14);--shadow-glow:0 0 0 4px rgba(59,111,247,.1),0 6px 22px -8px rgba(59,111,247,.45)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#f6f8fc 0%,#eef2f9 100%);color:var(--ink-900);-webkit-font-smoothing:antialiased;font-size:15px}
a{color:var(--brand-700);text-decoration:none}a:hover{color:var(--brand-600)}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.shell{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:#fff;box-shadow:var(--shadow-soft);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.sidebar-logo{display:flex;align-items:center;gap:11px;padding:8px 10px;margin-bottom:12px}
.sidebar-logo-mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--brand-500),var(--brand-600));box-shadow:var(--shadow-glow)}
.sidebar-logo-text{font-size:15px;font-weight:600}
.sidebar-item{padding:11px 12px;border-radius:12px;font-size:14.5px;color:var(--ink-600);display:block}
.sidebar-item--active{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.main{flex:1;min-width:0}
.page{padding:28px 36px 120px;display:flex;flex-direction:column;gap:22px;max-width:1720px}
.card{background:#fff;border-radius:20px;box-shadow:var(--shadow-card)}
.pad{padding:26px 28px}
.kick{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-400)}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-title{font-size:20px;font-weight:600;letter-spacing:-.026em}
.sec-sub{font-size:14px;color:var(--ink-500)}
.tip{position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;font-size:12.5px;font-weight:500;letter-spacing:0;padding:6px 10px;border-radius:9px;white-space:nowrap;z-index:20;pointer-events:none;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
/* ---------- ХЕРО ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,540px);overflow:hidden}
.hero-l{padding:28px 32px;display:flex;flex-direction:column;justify-content:center;gap:13px;min-height:340px;position:relative;z-index:2}
.hero-h1{font-size:38px;font-weight:600;letter-spacing:-.036em;line-height:1.1}
.hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-sub{font-size:15.5px;color:var(--ink-500);max-width:560px;line-height:1.5}
.hero-img{position:relative;overflow:hidden;pointer-events:none;min-height:340px}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 12%;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.7) 8%,#000 17%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.7) 8%,#000 17%)}
.hero-img::after{content:"";position:absolute;inset:0 auto 0 0;width:20%;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.45) 60%,rgba(255,255,255,0) 100%)}
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-btn{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--ink-200);background:#fff;font-size:16px;color:var(--ink-600);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.wk-btn:hover{border-color:var(--brand-500);color:var(--brand-600)}
.wk-btn[disabled]{opacity:.4;cursor:default}
.wk-label{font-size:15px;font-weight:600;letter-spacing:-.02em;min-width:150px;text-align:center}
.wk-badge{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:4px 8px;border-radius:7px;background:var(--brand-50);color:var(--brand-700)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:4px}
.kpi{border-radius:18px;padding:15px 17px;display:flex;flex-direction:column;gap:6px}
.kpi--main{background:var(--blue);color:#fff;box-shadow:0 16px 40px -20px rgba(45,94,239,.85)}
.kpi--soft{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 1px 2px rgba(16,24,40,.04),0 14px 34px -20px rgba(16,24,40,.2)}
.kpi-k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.kpi--main .kpi-k{color:rgba(255,255,255,.62)}
.kpi--soft .kpi-k{color:var(--ink-400)}
.kpi-v{font-size:23px;font-weight:600;letter-spacing:-.035em;line-height:1.1;white-space:nowrap}
.kpi-n{font-size:13.5px;line-height:1.4;margin-top:auto}
.kpi--main .kpi-n{color:rgba(255,255,255,.72)}
.kpi--soft .kpi-n{color:var(--ink-500)}
.pos{color:var(--green)}.neg{color:var(--red)}
/* ---------- ГРАФИКИ ---------- */
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.avg-row{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--ink-100)}
.avg{flex:1;display:flex;flex-direction:column;gap:3px}
.avg b{font-size:17px;font-weight:600;letter-spacing:-.03em}
.avg span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-400)}
.trend{position:relative;height:270px}
.trend svg{display:block;width:100%;height:100%;overflow:visible}
.tr-g{stroke:var(--ink-100);stroke-width:1}
.tr-yl{font-size:11px;fill:var(--ink-400);font-weight:500}
.tr-xl{font-size:13px;fill:var(--ink-500);font-weight:500}
.tr-xl.now{fill:var(--ink-900);font-weight:700}
.tr-hit{fill:transparent;cursor:pointer}
.tr-hit:hover{fill:rgba(45,94,239,.05)}
.tr-dot{cursor:pointer}
.tr-tip{position:absolute;transform:translate(-50%,-100%);background:var(--ink-900);color:#fff;border-radius:11px;padding:9px 12px;font-size:13px;line-height:1.45;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
.tr-tip.on{opacity:1}
.tr-tip b{font-weight:600}
.cbs{display:flex;flex-direction:column;gap:4px}
.cb{border:none;background:none;text-align:left;width:100%;padding:10px 12px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.cb:hover{background:var(--ink-50)}
.cb.on{background:var(--brand-50)}
.cb-h{display:flex;align-items:baseline;gap:10px}
.cb-n{font-size:15px;font-weight:600;letter-spacing:-.018em;color:var(--ink-800)}
.cb-p{font-size:12.5px;color:var(--ink-400);font-weight:500}
.cb-s{margin-left:auto;font-size:15.5px;font-weight:600;letter-spacing:-.024em;white-space:nowrap}
.cb-t{height:9px;border-radius:999px;background:var(--ink-100);overflow:hidden}
.cb-f{height:100%;border-radius:999px;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.cb-a{font-size:12.5px;color:var(--ink-400);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:14px;height:230px;padding:0 2px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;justify-content:flex-end}
.bpair{display:flex;align-items:flex-end;gap:7px;height:100%;width:100%;justify-content:center}
.bar{width:26px;border-radius:9px 9px 4px 4px;position:relative;min-height:4px}
.bar--in{background:linear-gradient(180deg,var(--brand-500),var(--brand-600))}
.bar--out{background:var(--ink-200)}

return SEED.map((r,i)=>({id:"s"+i,date:r[0],time:r[1],type:r[2],title:r[3],sub:r[4],cat:r[5],sum:r[6],method:r[7],status:r[8],txn:r[9]}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
const $=s=>document.querySelector(s);
const money=n=>(n<0?"− ":"")+Math.abs(Math.round(n)).toLocaleString("ru-RU").replace(/,/g," ")+" ₽";
const short=n=>{const a=Math.abs(n);return a>=1e6?(a/1e6).toFixed(a>=1e7?0:1).replace(".",",")+" млн ₽":a>=1e3?Math.round(a/1e3)+" тыс ₽":a+" ₽"};
const monthOf=d=>d.slice(0,7);
const months=()=>[...new Set(items.map(i=>monthOf(i.date)))].sort();
const mName=m=>MONTHS_N[+m.slice(5,7)-1]+" "+m.slice(0,4);
const dName=d=>{const p=d.split("-");return +p[2]+" "+MONTHS[+p[1]-1]};
const inMonth=i=>monthOf(i.date)===state.month;
const signed=i=>i.type==="in"?i.sum:-Math.abs(i.sum);
const counts=i=>i.status!=="failed";
function totals(m){const l=items.filter(i=>monthOf(i.date)===m&&counts(i));
const inc=l.filter(i=>i.type==="in").reduce((s,i)=>s+i.sum,0),out=l.filter(i=>i.type==="out").reduce((s,i)=>s+Math.abs(i.sum),0);
return{inc,out,prof:inc-out}}
/* ---------- ХЕРО ---------- */
function renderHero(){const ms=months(),idx=ms.indexOf(state.month),t=totals(state.month),prev=idx>0?totals(ms[idx-1]):null;
$("#m-h1").textContent=mName(state.month);$("#m-label").textContent=mName(state.month);
$("#m-badge").textContent=state.month==="2026-08"?"этот месяц":"архив";
$("#m-prev").disabled=idx<=0;$("#m-next").disabled=idx>=ms.length-1;
$("#kpis").innerHTML=`<div class="kpi kpi--soft"><div class="kpi-k">Приход</div><div class="kpi-v tnum pos">${money(t.inc)}</div></div>
<div class="kpi kpi--soft"><div class="kpi-k">Расход</div><div class="kpi-v tnum">${money(t.out)}</div></div>
<div class="kpi kpi--main"><div class="kpi-k">Разница</div><div class="kpi-v tnum">${money(t.prof)}</div></div>`}
/* ---------- КАТЕГОРИИ РАСХОДОВ ---------- */
function renderCatBars(){const l=items.filter(i=>inMonth(i)&&i.type==="out"&&counts(i));
const by={};l.forEach(i=>{by[i.cat]=(by[i.cat]||0)+Math.abs(i.sum)});
const ms=months(),tot={};items.filter(i=>i.type==="out"&&counts(i)).forEach(i=>{tot[i.cat]=(tot[i.cat]||0)+Math.abs(i.sum)});
const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),total=rows.reduce((s,r)=>s+r[1],0),max=rows.length?rows[0][1]:1;
$("#don-sub").textContent=total?money(total)+" за "+mName(state.month).toLowerCase():mName(state.month).toLowerCase();
$("#cbs").innerHTML=rows.length?rows.map(([k,v])=>{const a=Math.round((tot[k]||0)/ms.length),d=v-a;
return `<button type="button" class="cb${state.cat===k?" on":""}" data-cat="${k}"><div class="cb-h"><span class="cb-n">${CATS[k].n}</span><span class="cb-p tnum">${Math.round(v/total*100)}%</span><span class="cb-s tnum">${money(v)}</span></div><div class="cb-t"><div class="cb-f" style="width:${Math.max(v/max*100,2)}%;background:${CATS[k].c}"></div></div><div class="cb-a tnum">в среднем ${money(a)} в месяц${a&&d?" · "+(d>0?"+ ":"− ")+money(Math.abs(d)):""}</div></button>`}).join(""):`<p class="dr-note">В этом месяце расходов нет.</p>`;
$("#cbs").querySelectorAll(".cb").forEach(b=>b.onclick=()=>{state.cat=state.cat===b.dataset.cat?null:b.dataset.cat;if(state.cat)state.type="out";renderAll()})}
/* ---------- КАТЕГОРИИ ПРИХОДА ---------- */
function renderInBars(){const l=items.filter(i=>inMonth(i)&&i.type==="in"&&counts(i)&&i.sum>0);
const by={};l.forEach(i=>{by[i.cat]=(by[i.cat]||0)+i.sum});
const ms=months(),tot={};items.filter(i=>i.type==="in"&&counts(i)&&i.sum>0).forEach(i=>{tot[i.cat]=(tot[i.cat]||0)+i.sum});
const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),total=rows.reduce((s,r)=>s+r[1],0),max=rows.length?rows[0][1]:1;
$("#in-sub").textContent=total?money(total)+" за "+mName(state.month).toLowerCase():mName(state.month).toLowerCase();
$("#cbs-in").innerHTML=rows.length?rows.map(([k,v])=>{const a=Math.round((tot[k]||0)/ms.length),d=v-a;
return `<button type="button" class="cb${state.cat===k?" on":""}" data-cat="${k}"><div class="cb-h"><span class="cb-n">${CATS[k].n}</span><span class="cb-p tnum">${Math.round(v/total*100)}%</span><span class="cb-s tnum pos">${money(v)}</span></div><div class="cb-t"><div class="cb-f" style="width:${Math.max(v/max*100,2)}%;background:${CATS[k].c}"></div></div><div class="cb-a tnum">в среднем ${money(a)} в месяц${a&&d?" · "+(d>0?"+ ":"− ")+money(Math.abs(d)):""}</div></button>`}).join(""):`<p class="dr-note">В этом месяце поступлений нет.</p>`;
const pay=l.length,avgp=pay?Math.round(total/pay):0,ref=items.filter(i=>inMonth(i)&&i.status==="refund").reduce((s,i)=>s+Math.abs(i.sum),0);
$("#in-avg").innerHTML=`<div class="avg"><b class="tnum">${money(avgp)}</b><span>средняя оплата</span></div><div class="avg"><b class="tnum">${pay}</b><span>оплат за месяц</span></div><div class="avg"><b class="tnum">${ref?"− "+money(ref):"—"}</b><span>возвраты</span></div>`;
$("#cbs-in").querySelectorAll(".cb").forEach(b=>b.onclick=()=>{state.cat=state.cat===b.dataset.cat?null:b.dataset.cat;if(state.cat)state.type="in";renderAll()})}
/* ---------- ГРАФИК ПО МЕСЯЦАМ ---------- */
function renderBars(){const ms=months(),show=ms.slice(-6),data=show.map(m=>({m,...totals(m)}));
const W=1000,H=250,PL=54,PR=16,PT=14,PB=34,iw=W-PL-PR,ih=H-PT-PB;
const max=Math.max(...data.map(d=>Math.max(d.inc,d.out)),1),step=Math.pow(10,Math.floor(Math.log10(max)))/2,top=Math.ceil(max/step)*step;
const x=i=>PL+(data.length===1?iw/2:i*iw/(data.length-1)),y=v=>PT+ih-v/top*ih;
const path=k=>data.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(d[k]).toFixed(1)).join(" ");
const area=k=>path(k)+` L${x(data.length-1).toFixed(1)} ${PT+ih} L${x(0).toFixed(1)} ${PT+ih} Z`;
let grid="";for(let v=0;v<=top+1;v+=step){grid+=`<line class="tr-g" x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}"/><text class="tr-yl" x="${PL-10}" y="${y(v)+4}" text-anchor="end">${v?short(v):0}</text>`}
const dots=k=>data.map((d,i)=>`<circle class="tr-dot" cx="${x(i)}" cy="${y(d[k])}" r="${d.m===state.month?6:4.5}" fill="#fff" stroke="${k==="inc"?"#2d5eef":"#E5604D"}" stroke-width="3"/>`).join("");
const hits=data.map((d,i)=>{const w=iw/data.length;return `<rect class="tr-hit" data-i="${i}" x="${PL+i*w-(i?0:0)}" y="${PT}" width="${w}" height="${ih}" rx="10"/>`}).join("");
$("#trend").innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
<defs><linearGradient id="gin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d5eef" stop-opacity=".22"/><stop offset="1" stop-color="#2d5eef" stop-opacity="0"/></linearGradient></defs>
${grid}<path d="${area("inc")}" fill="url(#gin)"/>
<path d="${path("inc")}" fill="none" stroke="#2d5eef" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="${path("out")}" fill="none" stroke="#E5604D" stroke-width="3" stroke-dasharray="7 6" stroke-linejoin="round" stroke-linecap="round"/>
${dots("out")}${dots("inc")}
${data.map((d,i)=>`<text class="tr-xl${d.m===state.month?" now":""}" x="${x(i)}" y="${H-10}" text-anchor="middle">${MONTHS_N[+d.m.slice(5,7)-1].slice(0,3)}</text>`).join("")}
${hits}</svg><div class="tr-tip" id="tr-tip"></div>`;
const tip=$("#tr-tip"),box=$("#trend");
box.querySelectorAll(".tr-hit").forEach(r=>{const i=+r.dataset.i,d=data[i];
r.onmouseenter=()=>{const w=box.clientWidth,h=box.clientHeight;tip.innerHTML=`<b>${mName(d.m)}</b><br>Приход ${money(d.inc)}<br>Расход ${money(d.out)}<br>Разница ${money(d.prof)}`;
tip.style.left=x(i)/W*w+"px";tip.style.top=Math.max(y(Math.max(d.inc,d.out))/H*h-14,52)+"px";tip.classList.add("on")};
r.onmouseleave=()=>tip.classList.remove("on");
r.onclick=()=>{state.month=d.m;renderAll()}});
const avg=Math.round(data.reduce((s,d)=>s+d.prof,0)/data.length);
$("#bars-sub").textContent="нажмите на месяц";
$("#bars-note").textContent="Средняя разница: "+money(avg)}
/* ---------- ФИЛЬТРЫ + СПИСОК ---------- */
function catList(){const l=items.filter(inMonth).filter(i=>state.type==="all"||i.type===state.type);
const by={};l.forEach(i=>{by[i.cat]=(by[i.cat]||0)+1});return Object.entries(by).sort((a,b)=>b[1]-a[1])}
function renderCats(){const rows=catList();
$("#cats").innerHTML=`<button type="button" class="chip${state.cat?"":" on"}" data-cat="">Все категории</button>`+rows.map(([k,c])=>`<button type="button" class="chip${state.cat===k?" on":""}" data-cat="${k}"><span class="dot" style="background:${CATS[k].c}"></span>${CATS[k].n}<i>${c}</i></button>`).join("");
$("#cats").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat||null;renderAll()})}
function filtered(){let l=items.filter(inMonth);
if(state.type!=="all")l=l.filter(i=>i.type===state.type);
if(state.cat)l=l.filter(i=>i.cat===state.cat);
const q=state.q.trim().toLowerCase();
if(q)l=l.filter(i=>(i.title+" "+i.sub+" "+CATS[i.cat].n+" "+i.txn+" "+i.method).toLowerCase().includes(q));
if(state.sort==="sum")l.sort((a,b)=>Math.abs(b.sum)-Math.abs(a.sum));
else if(state.sort==="cat")l.sort((a,b)=>CATS[a.cat].n.localeCompare(CATS[b.cat].n)||b.date.localeCompare(a.date));
else l.sort((a,b)=>b.date.localeCompare(a.date)||(b.time||"").localeCompare(a.time||""));
return l}
function txRow(i){const st=STATUS[i.status],sum=signed(i);
return `<div class="tx" data-id="${i.id}"><span class="tx-ic" style="color:${CATS[i.cat].c}">${i.type==="in"?"↓":"↑"}</span>
<div class="tx-mid"><div class="tx-t">${esc(i.title)}</div><div class="tx-meta"><span class="tag tag--cat"><span class="dot" style="background:${CATS[i.cat].c}"></span>${CATS[i.cat].n}</span>${i.status!=="paid"?`<span class="tag tag--${st[1]}">${st[0]}</span>`:""}<span class="tag tag--sub">${esc(i.sub||i.method)}</span></div></div>
<div class="tx-r"><div class="tx-sum tnum ${i.type==="in"&&i.status!=="refund"?"pos":i.status==="refund"?"neg":""}">${i.type==="in"&&sum>0?"+ ":""}${money(sum)}</div><div class="tx-date tnum">${dName(i.date)} · ${i.time||""}</div></div>
<div class="tx-act"><button type="button" class="iconbtn tip" data-act="edit" data-tip="Изменить">✎</button></div></div>`}
function renderList(){const l=filtered();
$("#list-count").textContent=l.length?l.length+" из "+items.filter(inMonth).length+" операций месяца":"";
if(!l.length){$("#list").innerHTML=`<div class="empty">Ничего не нашлось. Сбросьте фильтры или измените поиск.</div>`;return}
let html="",day=null;
l.forEach(i=>{if(state.sort==="date"&&i.date!==day){day=i.date;const d=l.filter(x=>x.date===day),s=d.reduce((a,x)=>a+signed(x)*(counts(x)?1:0),0);
html+=`<div class="daysep"><b>${dName(day)}</b><hr /><span class="tnum">${s>=0?"+ ":""}${money(s)} за день</span></div>`}
html+=txRow(i)});
$("#list").innerHTML=html;
$("#list").querySelectorAll(".tx").forEach(r=>{const it=items.find(x=>x.id===r.dataset.id);
r.onclick=e=>{if(e.target.closest("[data-act]"))return;openDrawer(it)};
const b=r.querySelector('[data-act="edit"]');b.onclick=e=>{e.stopPropagation();openDrawer(it)}})}
function renderPend(){}
function renderAll(){renderHero();renderCatBars();renderInBars();renderBars();renderCats();renderList();
$("#type-seg").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.type===state.type));
fillCatSelect()}
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ---------- ПАНЕЛЬ ---------- */
function openDrawer(i){const opts=t=>Object.entries(CATS).filter(([k,v])=>v.t===t).map(([k,v])=>`<option value="${k}"${k===i.cat?" selected":""}>${v.n}</option>`).join("");
$("#drawer").innerHTML=`<div class="dr-h"><h2 class="sec-title">Операция</h2><button type="button" class="iconbtn" id="dr-x">✕</button></div>
<div class="dr-b">
<div class="fld"><label>Название</label><input type="text" id="d-title" value="${esc(i.title)}" /></div>
<div class="fld2"><div class="fld"><label>Тип</label><select id="d-type"><option value="in"${i.type==="in"?" selected":""}>Приход</option><option value="out"${i.type==="out"?" selected":""}>Расход</option></select></div>
<div class="fld"><label>Категория</label><select id="d-cat">${opts(i.type)}</select></div></div>
<div class="fld2"><div class="fld"><label>Сумма, ₽</label><input type="number" id="d-sum" value="${Math.abs(i.sum)}" /></div>
<div class="fld"><label>Дата</label><input type="date" id="d-date" value="${i.date}" /></div></div>
<div class="fld2"><div class="fld"><label>Статус</label><select id="d-status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${k===i.status?" selected":""}>${v[0]}</option>`).join("")}</select></div>
<div class="fld"><label>Способ</label><input type="text" id="d-method" value="${esc(i.method)}" /></div></div>
<div class="fld"><label>Комментарий</label><textarea id="d-sub">${esc(i.sub)}</textarea></div>
<div class="dr-acts"><button type="button" class="dr-act" id="d-dup">Повторить операцию</button><button type="button" class="dr-act dr-act--dan" id="d-del">Удалить</button></div>
<p class="dr-note">ID: ${esc(i.txn)} · ${i.method}. При удалении покажем уведомление с возможностью вернуть.</p>
</div>
<div class="dr-f"><button type="button" class="btn btn--pri" id="d-save">Сохранить</button><button type="button" class="btn btn--gh" id="d-cancel">Отмена</button></div>`;
$("#drawer").classList.add("on");$("#scrim").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");
const close=()=>{$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true")};
$("#dr-x").onclick=close;$("#d-cancel").onclick=close;$("#scrim").onclick=close;
$("#d-type").onchange=()=>{const t=$("#d-type").value;$("#d-cat").innerHTML=Object.entries(CATS).filter(([k,v])=>v.t===t).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")};
$("#d-save").onclick=()=>{const before=JSON.parse(JSON.stringify(items));
i.title=$("#d-title").value.trim()||i.title;i.type=$("#d-type").value;i.cat=$("#d-cat").value;
i.sum=Math.abs(+$("#d-sum").value||0)*(i.status==="refund"?-1:1);i.date=$("#d-date").value||i.date;
i.status=$("#d-status").value;i.method=$("#d-method").value;i.sub=$("#d-sub").value;
if(monthOf(i.date)!==state.month)state.month=monthOf(i.date);
close();commit("Операция обновлена",before)};
$("#d-del").onclick=()=>{const before=JSON.parse(JSON.stringify(items));items=items.filter(x=>x.id!==i.id);close();commit("Операция удалена",before)};
$("#d-dup").onclick=()=>{const before=JSON.parse(JSON.stringify(items));const c={...i,id:"n"+Date.now(),txn:i.txn+"_copy",date:new Date().toISOString().slice(0,10),time:"12:00",status:"pending"};items.push(c);close();commit("Операция скопирована, статус «Ожидает»",before)}}
/* ---------- ТОСТ ---------- */
function commit(msg,before){save();renderAll();toast(msg,before)}
function toast(msg,before){undo=before||null;$("#toast-t").textContent=msg;$("#toast-u").hidden=!before;$("#toast").classList.add("on");
clearTimeout(tmr);tmr=setTimeout(()=>$("#toast").classList.remove("on"),6000)}
$("#toast-u").onclick=()=>{if(undo){items=undo;undo=null;save();renderAll()}$("#toast").classList.remove("on")};
/* ---------- ДОБАВЛЕНИЕ ---------- */
function fillCatSelect(){if($("#a-cat").options.length)return;
const grp=t=>`<optgroup label="${t==="out"?"Расход":"Приход"}">`+Object.entries(CATS).filter(([k,v])=>v.t===t).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")+`</optgroup>`;
$("#a-cat").innerHTML=grp("out")+grp("in")}
$("#add").onsubmit=e=>{e.preventDefault();const sum=Math.abs(+$("#a-sum").value||0),cat=$("#a-cat").value;
if(!sum){toast("Укажите сумму");return}
const before=JSON.parse(JSON.stringify(items)),date=$("#a-date").value||"2026-08-28",type=CATS[cat].t;
items.push({id:"n"+Date.now(),date,time:new Date().toTimeString().slice(0,5),type,title:CATS[cat].n,sub:"Добавлено вручную",cat,sum,method:type==="in"?"Счёт на оплату":"Корп. карта",status:"paid",txn:"man_"+Math.random().toString(16).slice(2,10)});
$("#a-sum").value="";
if(monthOf(date)!==state.month)state.month=monthOf(date);
commit((type==="in"?"Приход":"Расход")+" добавлен: "+money(sum),before)};
/* ---------- ОСТАЛЬНОЕ ---------- */
$("#m-prev").onclick=()=>{const ms=months(),i=ms.indexOf(state.month);if(i>0){state.month=ms[i-1];renderAll()}};
$("#m-next").onclick=()=>{const ms=months(),i=ms.indexOf(state.month);if(i<ms.length-1){state.month=ms[i+1];renderAll()}};
$("#type-seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.type=b.dataset.type;if(state.cat&&CATS[state.cat].t!==state.type&&state.type!=="all")state.cat=null;renderAll()});
$("#q").oninput=e=>{state.q=e.target.value;renderList()};
$("#sort").onchange=e=>{state.sort=e.target.value;renderList()};
$("#csv").onclick=()=>{const l=filtered(),head=["Дата","Время","Тип","Название","Категория","Сумма","Способ","Статус","ID"];
const rows=l.map(i=>[i.date,i.time,i.type==="in"?"Приход":"Расход",i.title,CATS[i.cat].n,signed(i),i.method,STATUS[i.status][0],i.txn]);
const csv="\ufeff"+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="transactions-"+state.month+".csv";a.click();
toast("Выгружено "+l.length+" операций")};
$("#imp").onclick=()=>$("#impfile").click();
$("#impfile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
rd.onload=()=>{const lines=String(rd.result).replace(/^\ufeff/,"").split(/\r?\n/).filter(s=>s.trim());
const before=JSON.parse(JSON.stringify(items));let n=0;
lines.forEach((ln,idx)=>{const c=ln.split(/[;,\t]/).map(s=>s.trim().replace(/^"|"$/g,""));
const date=(c[0]||"").match(/^\d{4}-\d{2}-\d{2}$/)?c[0]:null;if(!date)return;
const sum=Math.abs(parseFloat(String(c[3]||c[2]||"").replace(/\s/g,"").replace(",",".")))||0;if(!sum)return;
const title=c[1]||"Из выписки";
const cname=(c[2]||"").toLowerCase(),key=Object.keys(CATS).find(k=>CATS[k].n.toLowerCase()===cname)||(/\+/.test(String(c[3]))?"course":"services");
items.push({id:"i"+Date.now()+idx,date,time:"12:00",type:CATS[key].t,title,sub:"Импорт выписки «"+f.name+"»",cat:key,sum,method:"Выписка",status:"paid",txn:"imp_"+Math.random().toString(16).slice(2,10)});n++});
e.target.value="";
if(!n){toast("В файле не нашлось строк: нужны столбцы дата; название; категория; сумма");return}
commit("Импортировано "+n+" операций из выписки",before)};
rd.readAsText(f,"utf-8")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on")}});
$("#a-date").value="2026-08-28";
renderAll();
</script>


</body></html>
